name: Sync UmaPenca Products

on:
  schedule:
    # Run every 6 hours (adjust as needed)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual trigger
    inputs:
      sync_type:
        description: 'Sync type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - incremental
          - products
          - inventory
          - pricing
      store:
        description: 'Store to sync (all, prataprint, bhumisprint)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - prataprint
          - bhumisprint
      product_id:
        description: 'Product ID (for single product sync)'
        required: false
        type: string
      upload_images:
        description: 'Upload images to Supabase Storage'
        required: false
        type: boolean
        default: true
      sync_to_db:
        description: 'Sync to Supabase Database'
        required: false
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - '.github/workflows/scripts/umapenca.py'
      - '.github/workflows/sync-umapenca.yml'

jobs:
  # Define store configuration matrix
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          STORE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.store || 'all' }}"
          if [ "$STORE" = "all" ]; then
            echo 'matrix=["prataprint", "bhumisprint"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"$STORE\"]" >> $GITHUB_OUTPUT
          fi

  sync-store:
    name: Sync ${{ matrix.store }} Products
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      UPLOAD_IMAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_images || 'true' }}
      SYNC_TO_DB: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_to_db || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm

      - name: Create output directory
        run: mkdir -p .github/workflows/scripts/${{ matrix.store }}/output

      - name: Configure store parameters
        id: store-config
        run: |
          STORE="${{ matrix.store }}"
          if [ "$STORE" = "prataprint" ]; then
            echo "url=https://prataprint.bhumisparshaschool.org" >> $GITHUB_OUTPUT
            echo "store_id=11210" >> $GITHUB_OUTPUT
            echo "subcollection=uma-penca" >> $GITHUB_OUTPUT
          elif [ "$STORE" = "bhumisprint" ]; then
            echo "url=https://umapenca.com/bhumisprint" >> $GITHUB_OUTPUT
            echo "store_id=11205" >> $GITHUB_OUTPUT
            echo "subcollection=uma-penca" >> $GITHUB_OUTPUT
          else
            echo "url=" >> $GITHUB_OUTPUT
            echo "store_id=" >> $GITHUB_OUTPUT
            echo "subcollection=uma-penca" >> $GITHUB_OUTPUT
          fi

      - name: Run Scraper
        id: sync
        run: |
          SCRIPT=".github/workflows/scripts/umapenca.py"
          OUTPUT=".github/workflows/scripts/${{ matrix.store }}/output/products.json"

          CMD="python3 $SCRIPT --full --output $OUTPUT"
          CMD="$CMD --url ${{ steps.store-config.outputs.url }}"
          CMD="$CMD --store-id ${{ steps.store-config.outputs.store_id }}"
          CMD="$CMD --subcollection ${{ steps.store-config.outputs.subcollection }}"

          if [ "${{ env.UPLOAD_IMAGES }}" = "true" ]; then
            CMD="$CMD --upload-images"
          fi

          if [ "${{ env.SYNC_TO_DB }}" = "true" ]; then
            CMD="$CMD --sync-to-db"
          fi

          if [ -n "${{ github.event.inputs.product_id }}" ]; then
            CMD="$CMD --product-id ${{ github.event.inputs.product_id }}"
            CMD="$CMD --full"
          fi

          echo "Running: $CMD"
          eval $CMD

      - name: Verify products.json
        if: success()
        run: |
          OUTPUT=".github/workflows/scripts/${{ matrix.store }}/output/products.json"
          if [ -f "$OUTPUT" ]; then
            echo "${{ matrix.store }} products.json generated successfully"
            python3 -c "import json; data=json.load(open('$OUTPUT')); print(f\"Store: {data.get('store', {}).get('name', 'N/A')}\"); print(f\"Total products: {data.get('total_products', 0)}\"); print(f\"Generated at: {data.get('generated_at', 'N/A')}\"); cats={}; [cats.__setitem__(p.get('category','unknown'), cats.get(p.get('category','unknown'),0)+1) for p in data.get('products',[])]; print('Categories:', dict(cats))"
          else
            echo "ERROR: products.json was not generated for ${{ matrix.store }}"
            exit 1
          fi

      - name: Upload products.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-${{ matrix.store }}-${{ github.run_id }}
          path: .github/workflows/scripts/${{ matrix.store }}/output/products.json
          retention-days: 30

      - name: Upload sync output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.store }}-${{ github.run_id }}
          path: .github/workflows/scripts/${{ matrix.store }}/output/
          retention-days: 7

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs-${{ matrix.store }}-${{ github.run_id }}
          path: |
            scraper_v3.log
            *.json
          retention-days: 7

      - name: Commit products.json to repository
        if: success() && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/scripts/${{ matrix.store }}/output/products.json
          git diff --staged --quiet || git commit -m "chore: update ${{ matrix.store }} products.json from sync

          🤖 Generated with [Qoder](https://qoder.com)"

      - name: Push products.json
        if: success() && github.ref == 'refs/heads/master'
        run: git push

  notify-failure:
    name: Notify on Failure
    needs: [sync-store]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `UmaPenca Sync Failed - Run #${{ github.run_number }}`,
              body: `The UmaPenca sync workflow failed.\n\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n**Branch:** ${{ github.ref_name }}`,
              labels: ['bug', 'automation']
            })
