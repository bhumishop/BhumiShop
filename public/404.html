<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BhumiShop - Loading...</title>
  <script>
    // GitHub Pages SPA fallback - redirect to index.html while preserving path
    (function() {
      var path = window.location.pathname;

      // Detect the base path (e.g., /bhumi-shop/ for GitHub Pages, / for custom domain)
      var pathParts = path.split('/').filter(Boolean);
      var base = '/';

      // Known app routes - if the first segment is one of these, we're at root
      var appRoutes = ['produtos', 'carrinho', 'checkout', 'login', 'minhas-compras', 'perfil', 'admin'];
      if (pathParts.length > 0 && !appRoutes.includes(pathParts[0])) {
        // First segment is not an app route - likely the repo name for GitHub Pages
        base = '/' + pathParts[0] + '/';
      }

      // Only redirect if we're not already at index.html
      if (!path.endsWith('/index.html') && path !== base) {
        // Store the path (relative to base) so index.html can use it
        var relativePath = path.replace(base, '/');
        if (!relativePath.startsWith('/')) {
          relativePath = '/' + relativePath;
        }
        sessionStorage.setItem('spa-redirect-path', relativePath + window.location.search + window.location.hash);
        // Redirect to index.html at the detected base
        window.location.href = base + 'index.html';
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
