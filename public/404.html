<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BhumiShop - Loading...</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // If already at index.html, nothing to do
      if (path.endsWith('/index.html') || path === '/' || path === '') {
        return;
      }

      // Detect the base path - for custom domain use /
      var pathParts = path.split('/').filter(Boolean);
      var base = '/';

      // Known app routes - handle both static routes and dynamic slugs like /produtos/slug
      var appRoutes = ['produtos', 'carrinho', 'checkout', 'login', 'minhas-compras', 'perfil', 'admin', 'sobre-nos', 'contato', 'faq', 'privacidade', 'termos', 'trocas', 'envio'];

      if (pathParts.length > 0 && !appRoutes.includes(pathParts[0].toLowerCase())) {
        // First segment is not an app route - likely the repo name for GitHub Pages
        base = '/' + pathParts[0] + '/';
        pathParts = pathParts.slice(1);
      }

      // Build the SPA path from remaining parts
      var spaPath = '/' + pathParts.join('/');
      
      // Store path for SPA router to handle
      if (spaPath !== '/') {
        sessionStorage.setItem('spa-redirect-path', spaPath + search + hash);
      }

      // Redirect to index.html
      window.location.replace(base + 'index.html');
    })();
  </script>
</head>
<body>
  <p>Loading...</p>
</body>
</html>
